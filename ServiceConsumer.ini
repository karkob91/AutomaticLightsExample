[Server]
# Orchestrator base URI (for HTTP)
; or_base_uri = http://arrowhead.tmit.bme.hu:8440/orchestrator/orchestration

; # Orchestrator base URI (for HTTPS)
; or_base_uri_https = https://arrowhead.tmit.bme.hu:8441/orchestrator/orchestration

sr_base_uri=http://172.25.164.36:8441/orchestrator/orchestration
sr_base_uri_https=https://172.25.164.36:8441/orchestrator/orchestration
# Service Consumer Address (IPv4)
address = 10.0.0.12

# Service Consumer Address (IPv6, used if IPv4 is not available)
address6 = [::1]

# Service Consumer Port
port = 8454

[System]
# System name for this consumer
system_name = ExampleConsumerSystem

[Security]
# Set to true to use secure communication
use_secure = false

# Certificate path for secure communication
cert_path = certs/consumer.crt

# Private key path for secure communication
key_path = certs/consumer.key

# Trusted CA path for secure communication
ca_path = certs/ca.crt

# Client token if using token-based security
token = 

[Orchestration]
# Default timeout for orchestration requests (in seconds)
timeout = 10

# Maximum number of retry attempts for orchestration
max_retries = 3

# Retry interval (in seconds)
retry_interval = 5